var st={tab:1,key:"t",dir:-1};
var COLS=[["t","Tgl masuk / keluar"],["no","Nomor surat"],["a","Asal / Tujuan"],["k","Kategori"],["i","Isi surat"],["p","Pelaksanaan"],["dis","Disposisi kepada"],["l","Surat"]];
function val(r,k){if(k==="dis")return r.dis.join(", ");if(k==="l")return safe(r.l)?"ada":"";return r[k]||""}
// init controls
function fillFilters(){var cats=[],pen=[];
DATA.forEach(function(r){if(cats.indexOf(r.k)<0)cats.push(r.k);r.dis.forEach(function(n){if(pen.indexOf(n)<0)pen.push(n)})});
cats.sort();pen.sort();
$("fk").innerHTML='<option value="">Semua</option>'+cats.map(function(c){return'<option>'+esc(c)+'</option>'}).join("");
$("pop").innerHTML=pen.map(function(n){return'<label><input type="checkbox" value="'+esc(n)+'"> '+esc(n)+'</label>'}).join("");}
$("hr").innerHTML=COLS.map(function(c){return'<th scope="col" data-k="'+c[0]+'"><button class="sb" type="button">'+c[1]+'<span class="ar" aria-hidden="true">▲▼</span></button></th>'}).join("");
$("ms").innerHTML=COLS.map(function(c){return'<option value="'+c[0]+'">Urutkan: '+c[1]+'</option>'}).join("");
function sel(){return[].slice.call($("pop").querySelectorAll("input:checked")).map(function(i){return i.value})}
function filt(base){
 var q=$("q").value.trim().toLowerCase(),j=$("fj").value,k=$("fk").value,ps=sel(),a=$("fd").value,b=$("fs").value;
 return DATA.filter(function(r){
  if(j&&r.j!==j)return false;if(k&&r.k!==k)return false;
  if(ps.length&&!ps.some(function(n){return r.dis.indexOf(n)>=0}))return false;
  if(a||b){var v=base==="p"?r.p:r.t;if(!v)return false;var en=base==="p"?endOf(r):v;if(a&&en<a)return false;if(b&&v>b)return false}
  if(q){var h=[r.no,r.a,r.i,r.k,r.ds,r.dk,r.db,r.lok,r.t,r.p,fd(r.t),fd(r.p),fdl(r.t),fdl(r.p)].join(" ").toLowerCase();if(h.indexOf(q)<0)return false}
  return true});
}
function planTxt(r){
 if(!r.p)return'<span class="mut">—</span>';
 var n=dd(r.p),og=n<0&&dd(endOf(r))>=0,c=(n>=0&&n<=1)||og?"w":n>1?"rl":"mut";
 return'<div>'+esc(rng(r))+'</div><div class="'+c+'">'+(og?"Sedang berlangsung":rel(n))+(r.hr>1?' · '+r.hr+' hari':'')+'</div>'+(r.jam?'<div>'+esc(r.jam)+'</div>':"")+(r.lok?'<div class="mut">'+esc(r.lok)+'</div>':"");
}
function chips(r){
 if(r.j==="keluar")return'<span class="mut">—</span>';
 if(r.mt)return'<span class="chip w">Belum disposisi</span>';
 if(!r.dis.length)return'<span class="mut">—</span>';
 return r.dis.map(function(n){return'<span class="chip">'+esc(n)+'</span>'}).join("");
}
function dispTxt(r){
 if(!r.pa.length)return'<span class="mut">—</span>';
 return'<ul class="dl">'+r.pa.map(function(x){return'<li>'+(x.n?'<b>'+esc(x.n)+':</b> ':"")+esc(x.x)+'</li>'}).join("")+'</ul>';
}
function btn(r){var u=safe(r.l);return u?'<a class="open" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Buka surat</a>':'<span class="mut">Belum ada link</span>'}
function renderAll(){
 var rows=filt($("fb").value),k=st.key,d=st.dir;
 rows.sort(function(x,y){
  var a=val(x,k),b=val(y,k);
  if(!a&&!b)return 0;if(!a)return 1;if(!b)return-1;
  var c=a<b?-1:a>b?1:a.localeCompare?a.localeCompare(b,"id"):0;
  if(typeof a==="string"&&!/^\d{4}-/.test(a))c=a.localeCompare(b,"id",{numeric:true});
  return c*d});
 document.querySelectorAll("#hr th").forEach(function(th){
  var on=th.dataset.k===k;th.setAttribute("aria-sort",on?(d>0?"ascending":"descending"):"none");
  th.querySelector(".ar").textContent=on?(d>0?"▲":"▼"):"▲▼"});
 $("ms").value=k;$("md").textContent=d>0?"↑":"↓";$("md").setAttribute("aria-label",d>0?"Naik":"Turun");
 $("cnt").textContent=rows.length+" surat ditemukan";
 $("tb").innerHTML=rows.length?rows.map(function(r){
  var i=DATA.indexOf(r);
  return'<tr tabindex="0" data-i="'+i+'">'+
  '<td data-l="Tgl masuk / keluar">'+esc(fd(r.t))+'</td>'+
  '<td data-l="Nomor surat" class="mono">'+esc(r.no)+'</td>'+
  '<td data-l="Asal / Tujuan"><span class="tag '+(r.j==="masuk"?"in":"out")+'">'+(r.j==="masuk"?"Masuk":"Keluar")+'</span><div>'+esc(r.a)+'</div></td>'+
  '<td data-l="Kategori">'+esc(r.k)+'</td>'+
  '<td data-l="Isi surat">'+esc(r.i)+'</td>'+
  '<td data-l="Pelaksanaan"'+(r.p?"":' class="e"')+'>'+planTxt(r)+'</td>'+
  '<td data-l="Disposisi kepada">'+chips(r)+'</td>'+
  
  '<td data-l="Surat">'+btn(r)+'</td></tr>'}).join(""):'<tr><td class="empty">Tidak ada surat yang cocok.</td></tr>';
}
function renderInv(){
 var rows=filt("p").filter(function(r){return r.p&&dd(endOf(r))>=0}).sort(function(a,b){return a.p<b.p?-1:a.p>b.p?1:(a.jam<b.jam?-1:1)});
 $("cnt").textContent=rows.length+" undangan ditemukan";
 $("iv").innerHTML=rows.length?rows.map(function(r){
  var on=dd(r.p)<0,n=Math.max(0,dd(r.p)),c=n<=1?"w":"";
  return'<button type="button" class="card" data-i="'+DATA.indexOf(r)+'">'+
  '<span class="bigd '+c+'">'+esc(r.hr>1?rng(r):fdl(r.p))+'</span><span class="'+(n<=1?"w":"rl")+'">'+(on?"Sedang berlangsung":rel(n))+(r.hr>1?' · '+r.hr+' hari':'')+'</span>'+
  '<h3>'+esc(r.i)+'</h3>'+
  '<span><span class="tag '+(r.j==="masuk"?"in":"out")+'">'+(r.j==="masuk"?"Masuk":"Keluar")+'</span> '+esc(r.k)+'</span>'+
  '<span>'+(r.jam?esc(r.jam):'<span class="mut">Jam belum ditentukan</span>')+(r.lok?' · '+esc(r.lok):"")+'</span>'+
  '<span class="mut">'+esc(r.a)+'</span><span class="mono">'+esc(r.no)+'</span>'+
  '<span>'+chips(r)+'</span></button>'}).join(""):'<div class="empty">Tidak ada undangan mendatang yang cocok.</div>';
}
function render(){
 $("bw").style.display=st.tab!==1?"none":"";
 st.tab===1?renderAll():st.tab===2?renderInv():renderCal();
}
// summary
function summ(){
 var m=T.getMonth(),y=T.getFullYear(),e=off(7),t0=off(0),a=0,b=0,c=0;
 DATA.forEach(function(r){var d=pd(r.t);if(d&&d.getMonth()===m&&d.getFullYear()===y){r.j==="masuk"?a++:b++}
  if(r.p&&endOf(r)>=t0&&r.p<=e)c++});
 $("s1").textContent=a;$("s2").textContent=b;$("s3").textContent=c;
}
// events
$("hr").addEventListener("click",function(e){
 var th=e.target.closest("th");if(!th)return;var k=th.dataset.k;
 if(st.key===k)st.dir=-st.dir;else{st.key=k;st.dir=1}renderAll()});
$("ms").addEventListener("change",function(){st.key=this.value;st.dir=1;renderAll()});
$("md").addEventListener("click",function(){st.dir=-st.dir;renderAll()});
$("f").addEventListener("input",function(){
 var s=sel();$("fps").textContent=s.length?s.join(", "):"Semua penerima";render()});
$("rs").addEventListener("click",function(){
 $("f").reset();$("fps").textContent="Semua penerima";render()});
function tab(n){
 st.tab=n;
 $("t1").setAttribute("aria-selected",n===1);$("t2").setAttribute("aria-selected",n===2);$("t3").setAttribute("aria-selected",n===3);
 $("p1").hidden=n!==1;$("p2").hidden=n!==2;$("p3").hidden=n!==3;render()}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};$("t3").onclick=function(){tab(3)};
// kalender
st.cy=T.getFullYear();st.cm=T.getMonth();st.sel=off(0);
var BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function renderCal(){
 var y=st.cy,m=st.cm,by={},n=0,h="";
 filt("p").forEach(function(r){if(r.p)r.dates.forEach(function(kk){(by[kk]=by[kk]||[]).push(r)})});
 var lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),tot=Math.ceil((lead+dim)/7)*7;
 ["Sen","Sel","Rab","Kam","Jum","Sab","Min"].forEach(function(w){h+='<div class="cw">'+w+'</div>'});
 for(var c=0;c<tot;c++){
  var d=new Date(y,m,1-lead+c),k=iso(d),ev=by[k]||[],out=d.getMonth()!==m;
  if(!out)n+=ev.length;
  h+='<div class="cc'+(out?" x":"")+(k===iso(T)?" t":"")+(k===st.sel?" s":"")+(ev.length>=3?" f":ev.length?" a":"")+'"><button class="dn" type="button" data-d="'+k+'" aria-label="'+esc(fdl(k))+', '+(ev.length?ev.length+' acara':'kosong')+'">'+d.getDate()+(ev.length?'<small>'+(ev.length>=3?'Penuh · ':'')+ev.length+'</small>':'')+'</button>';
  ev.slice(0,3).forEach(function(r){h+='<button class="ev '+(r.j==="masuk"?"in":"out")+'" type="button" data-i="'+DATA.indexOf(r)+'" aria-label="'+esc(r.i)+'">'+esc((r.jam?r.jam.slice(0,5)+' ':'')+r.i+(r.hr>1?' (hari '+hk(r,k)+'/'+r.hr+')':''))+'</button>'});
  if(ev.length>3)h+='<button class="ev mo" type="button" data-d="'+k+'">+'+(ev.length-3)+' lagi</button>';
  h+='</div>';
 }
 var sl=by[st.sel]||[];
 $("cnt").textContent=n+" acara pada "+BLN[m]+" "+y;
 $("p3").innerHTML='<div class="cn"><button class="tbtn" type="button" data-nav="-1" aria-label="Bulan sebelumnya" style="color:var(--pri)">◀</button><h2 aria-live="polite">'+BLN[m]+' '+y+'</h2><button class="tbtn" type="button" data-nav="1" aria-label="Bulan berikutnya" style="color:var(--pri)">▶</button><button class="tbtn" type="button" data-nav="t" style="color:var(--pri)">Bulan ini</button></div>'+
 '<div class="cal">'+h+'</div>'+
 '<div class="lg"><span><i></i>Kosong</span><span><i style="background:var(--inbg)"></i>Ada acara (1–2)</span><span><i style="background:var(--warnbg);border-color:var(--warn)"></i>Penuh (3+)</span><span><i style="background:var(--pri)"></i>Surat masuk</span><span><i style="background:var(--out)"></i>Surat keluar</span></div>'+
 '<h3 style="margin:0 0 8px">'+esc(fdl(st.sel))+(sl.length?' · '+sl.length+' acara':'')+'</h3>'+
 (sl.length?'<div class="inv">'+sl.map(function(r){return'<button type="button" class="card" data-i="'+DATA.indexOf(r)+'"><h3>'+esc(r.i)+'</h3>'+(r.hr>1?'<span class="rl">Hari ke-'+hk(r,st.sel)+' dari '+r.hr+' hari ('+esc(rng(r))+')</span>':'')+'<span><span class="tag '+(r.j==="masuk"?"in":"out")+'">'+(r.j==="masuk"?"Masuk":"Keluar")+'</span> '+esc(r.k)+'</span><span>'+(r.jam?esc(r.jam):'<span class="mut">Jam belum ditentukan</span>')+(r.lok?' · '+esc(r.lok):'')+'</span><span class="mut">'+esc(r.a)+'</span></button>'}).join("")+'</div>':'<div class="mut">Tidak ada acara. Tanggal ini masih kosong.</div>');
 if(st.rf){var f=$("p3").querySelector(st.rf);if(f)f.focus();st.rf=null}
}
$("p3").addEventListener("click",function(e){
 var nv=e.target.closest("[data-nav]");
 if(nv){var a=nv.dataset.nav;
  if(a==="t"){st.cy=T.getFullYear();st.cm=T.getMonth();st.sel=off(0)}
  else{var d=new Date(st.cy,st.cm+ +a,1);st.cy=d.getFullYear();st.cm=d.getMonth();st.sel=iso(d)}
  st.rf='[data-nav="'+a+'"]';renderCal();return}
 var ev=e.target.closest("[data-i]");if(ev){open(+ev.dataset.i,ev);return}
 var dn=e.target.closest("[data-d]");
 if(dn){st.sel=dn.dataset.d;st.rf='[data-d="'+dn.dataset.d+'"]';renderCal()}});
// detail
var last=null;
function open(i,el){
 var r=DATA[i];last=el;
 var dp=r.pa.length?'<ul class="dl">'+r.pa.map(function(x){return'<li>'+(x.n?'<b>'+esc(x.n)+':</b> ':'')+esc(x.x)+'</li>'}).join("")+'</ul>':'<span class="mut">—</span>';
 $("pn").innerHTML='<button class="tbtn cl" id="cx" type="button" style="color:var(--pri)">Tutup ✕</button>'+
 '<span class="tag '+(r.j==="masuk"?"in":"out")+'">Surat '+(r.j==="masuk"?"Masuk":"Keluar")+'</span>'+
 '<h2 id="pt">'+esc(r.i)+'</h2><dl>'+
 '<dt>Nomor surat</dt><dd class="mono">'+esc(r.no)+'</dd>'+
 '<dt>Kategori</dt><dd>'+esc(r.k)+'</dd>'+
 '<dt>'+(r.j==="masuk"?"Asal surat":"Tujuan surat")+'</dt><dd>'+esc(r.a)+'</dd>'+
 '<dt>Tanggal '+(r.j==="masuk"?"masuk":"keluar")+'</dt><dd>'+esc(fdl(r.t))+'</dd>'+
 '<dt>Pelaksanaan</dt><dd>'+(r.p?(r.hr>1?esc(rng(r))+' ('+r.hr+' hari)':esc(fdl(r.p))+' ('+rel(dd(r.p))+')')+(r.jam?'<br>Jam: '+esc(r.jam):'')+(r.lok?'<br>Lokasi: '+esc(r.lok):''):'<span class="mut">—</span>')+'</dd>'+
 '<dt>Disposisi kepada</dt><dd>'+chips(r)+'</dd>'+
 (r.j==="keluar"?"":lv("Disposisi Kalakhar",r.dk)+lv("Disposisi Kabid 1",r.db)+(r.pa.length?'<dt>Disposisi Kasi</dt><dd>'+dp+'</dd>':"")+((!r.dk&&!r.db&&!r.pa.length)?'<dt>Isi disposisi</dt><dd class="mut">Belum ada isi disposisi</dd>':""))+
 '<dt>Surat</dt><dd>'+btn(r)+'</dd></dl>';
 $("ov").classList.add("on");$("cx").focus();
 $("cx").onclick=close;
}
function close(){$("ov").classList.remove("on");if(last&&last.focus)last.focus()}
$("ov").addEventListener("click",function(e){if(e.target===this)close()});
document.addEventListener("keydown",function(e){
 if(!$("ov").classList.contains("on"))return;
 if(e.key==="Escape")close();
 if(e.key==="Tab"){var f=$("pn").querySelectorAll("a,button");if(!f.length)return;var a=f[0],b=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});
function pick(e){
 if(e.target.closest("a"))return;
 var el=e.target.closest("[data-i]");if(el&&el.dataset.i!==undefined&&!el.matches("th"))open(+el.dataset.i,el)}
$("tb").addEventListener("click",pick);$("iv").addEventListener("click",pick);
$("tb").addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr")){e.preventDefault();open(+e.target.dataset.i,e.target)}});
// theme
$("th").onclick=function(){
 var r=document.documentElement,c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
 r.setAttribute("data-theme",c==="dark"?"light":"dark")};
load();
})();
</script>
</body>
</html>
